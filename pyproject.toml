[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py-llm-gateway"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible LLM gateway with fallback routing, retries, circuit breakers, rate limits, caching and cost metrics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhavana Sanal" }]
requires-python = ">=3.12"
keywords = ["llm", "gateway", "openai", "anthropic", "proxy", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[project.urls]
Repository = "https://github.com/bhavana-sanal/py-llm-gateway"
Issues = "https://github.com/bhavana-sanal/py-llm-gateway/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "openai>=1.50",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "RET", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]

[tool.mypy]
strict = true
packages = ["llm_gateway"]
mypy_path = "src"
